{% extends 'base.html' %}

{% block title %}
    {% if object %}Editar Módulo{% else %}Crear Nuevo Módulo{% endif %}
{% endblock %}

{% block content %}
<div class="container mx-auto mt-5 max-w-2xl">
    <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
        <h2 class="text-xl font-bold mb-6">
            {% if object %}Editar Módulo: {{ object.name }}{% else %}Registrar Nuevo Módulo{% endif %}
        </h2>

        <form method="post" action="">
            {% csrf_token %}
            
            <!-- Renderizado de formulario de Django -->
            <div class="space-y-4">
                {{ form.as_p }}
            </div>

            <div class="flex items-center justify-end mt-6 space-x-3">
                <a href="{% url 'consultorio:module_list' %}" class="text-gray-600 hover:text-gray-900 px-4 py-2">
                    Cancelar
                </a>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    Guardar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
