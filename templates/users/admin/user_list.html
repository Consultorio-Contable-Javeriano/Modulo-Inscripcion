{% extends 'base.html' %}

{% block title %}Usuarios – Admin{% endblock %}

{% block content %}
<div class="bg-javblue">
    <div class="max-w-6xl mx-auto py-8 px-4">
        <p class="text-xs font-bold uppercase tracking-wide text-javgold mb-1">Panel administrativo</p>
        <h1 class="text-3xl font-extrabold text-white">Directorio de usuarios</h1>
    </div>
</div>

<div class="max-w-6xl mx-auto py-8 px-4">
    <!-- Buscador HTMX -->
    <div class="mb-5">
        <input type="text"
               name="q"
               value="{{ request.GET.q }}"
               placeholder="Buscar por nombre o correo..."
               class="w-full sm:max-w-xs border border-gray-300 rounded-sm px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-javblue"
               hx-get="{% url 'consultorio:admin_user_list' %}"
               hx-trigger="keyup changed delay:400ms"
               hx-target="#user-table-body"
               hx-include="[name=q]">
    </div>

    <div class="bg-white rounded shadow-sm border border-gray-100 overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200 text-sm">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Nombre</th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Correo</th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Documento</th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Teléfono</th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Nivel educativo</th>
                    <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Registro</th>
                    <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase">Perfil</th>
                </tr>
            </thead>
            <tbody id="user-table-body" class="bg-white divide-y divide-gray-100">
                {% include 'users/admin/partials/user_rows.html' %}
            </tbody>
        </table>
    </div>

    <div class="mt-6 flex gap-4 text-sm">
        <a href="{% url 'consultorio:admin_module_list' %}" class="text-javblue hover:underline">Módulos</a>
        <span class="text-gray-300">·</span>
        <a href="{% url 'consultorio:admin_enrollment_list' %}" class="text-javblue hover:underline">Inscripciones</a>
    </div>
</div>
{% endblock %}
