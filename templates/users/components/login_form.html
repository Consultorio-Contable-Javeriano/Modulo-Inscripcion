<form hx-post="{% url 'login' %}" hx-target="#login-form-wrapper" hx-swap="outerHTML" class="space-y-4 [&_input]:w-full [&_input]:border [&_input]:border-gray-300 [&_input]:rounded-sm [&_input]:px-3 [&_input]:py-2 [&_input]:mt-1 [&_input]:focus:outline-none [&_input]:focus:ring-2 [&_input]:focus:ring-javblue">
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

    <!-- Cuenta bloqueada temporalmente por intentos fallidos -->
    {% if lockout_notice %}
    <div class="p-3 rounded border-l-4 bg-amber-50 border-javgold text-javnavy text-sm">
        {{ lockout_notice }}
    </div>
    {% endif %}

    <!-- Muestra errores globales del formulario si los hay -->
    {% if form.non_field_errors %}
    <div class="p-3 rounded border-l-4 bg-red-50 border-red-500 text-red-800 text-sm">
        {{ form.non_field_errors }}
    </div>
    {% endif %}

    <div class="flex flex-col">
        <label for="id_username" class="text-sm font-medium text-gray-700">Correo electrónico</label>
        {{ form.username }}
    </div>

    <div class="flex flex-col">
        <label for="id_password" class="text-sm font-medium text-gray-700">Contraseña</label>
        {{ form.password }}
    </div>

    <button type="submit" class="w-full bg-javblue text-white font-semibold uppercase text-sm tracking-wide p-2.5 rounded-sm hover:bg-javnavy transition-colors">
        Iniciar sesión
    </button>
</form>
