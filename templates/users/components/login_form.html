<form hx-post="{% url 'login' %}" hx-target="#login-form-wrapper" hx-swap="outerHTML" class="space-y-4">
    {% csrf_token %}
    
    <!-- Muestra errores globales del formulario si los hay -->
    {{ form.non_field_errors }}

    <div class="flex flex-col">
        <label for="id_username" class="text-sm font-medium text-gray-700">Correo Electrónico:</label>
        {{ form.username }}
    </div>

    <div class="flex flex-col">
        <label for="id_password" class="text-sm font-medium text-gray-700">Contraseña:</label>
        {{ form.password }}
    </div>

    <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded-md hover:bg-blue-700 transition-colors">
        Iniciar Sesión
    </button>
</form>
